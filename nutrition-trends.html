<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrition & Meal Prep Trends - Social Media Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e7a1e 0%, #2d5c2d 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            border: 3px solid white;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.2em;
            margin: 5px 0;
        }
        
        .nav-buttons {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .nav-buttons a {
            display: inline-block;
            background: white;
            color: #1e7a1e;
            padding: 12px 30px;
            margin: 5px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
            border: 3px solid #145214;
        }
        
        .nav-buttons a:hover {
            background: #1e7a1e;
            color: white;
            transform: scale(1.05);
        }
        
        .section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        
        .section h2 {
            color: #1e7a1e;
            margin-bottom: 20px;
            font-size: 2em;
            border-bottom: 3px solid #1e7a1e;
            padding-bottom: 10px;
        }
        
        .platform-trends {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .platform-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #1e7a1e;
            transition: all 0.3s;
        }
        
        .platform-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .platform-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 1.5em;
            font-weight: bold;
            color: #1e7a1e;
        }
        
        .platform-icon {
            width: 40px;
            height: 40px;
            margin-right: 10px;
            font-size: 1.5em;
        }
        
        .trend-item {
            background: white;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border-left: 4px solid #1e7a1e;
        }
        
        .trend-item strong {
            color: #1e7a1e;
        }
        
        .engagement {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }
        
        .posts-grid {
            display: grid;
            gap: 20px;
        }
        
        .post-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            border: 2px solid #1e7a1e;
            position: relative;
            transition: all 0.3s;
        }
        
        .post-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .post-number {
            position: absolute;
            top: -15px;
            left: 20px;
            background: #1e7a1e;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2em;
            border: 3px solid white;
        }
        
        .post-platform {
            color: #1e7a1e;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        .post-content {
            line-height: 1.6;
            color: #333;
            margin-bottom: 15px;
        }
        
        .post-hashtags {
            color: #1e7a1e;
            font-weight: bold;
            flex-wrap: wrap;
        }
        
        .post-hashtags span {
            margin-right: 8px;
        }
        
        .copy-button {
            background: #1e7a1e;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: all 0.3s;
        }
        
        .copy-button:hover {
            background: #145214;
            transform: scale(1.05);
        }
        
        .copy-button.copied {
            background: #28a745;
        }
        
        .trend-summary {
            background: #e8f5e9;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 5px solid #1e7a1e;
        }
        
        .trend-summary h3 {
            color: #1e7a1e;
            margin-bottom: 10px;
        }
        
        .trend-summary ul {
            margin-left: 20px;
        }
        
        .trend-summary li {
            margin: 5px 0;
            color: #333;
        }
        
        .refresh-button {
            background: #1e7a1e;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            margin: 20px auto;
            display: block;
            transition: all 0.3s;
            border: 3px solid #145214;
        }
        
        .refresh-button:hover {
            background: #145214;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🥗 Nutrition & Meal Prep Trends 🍳</h1>
            <p>Social Media Trend Analysis & Post Generator</p>
        </div>
        
        <div class="nav-buttons">
            <a href="index.html">← Back to Battle of the Books</a>
        </div>
        
        <div class="section">
            <h2>📊 Current Trending Topics</h2>
            
            <div class="trend-summary">
                <h3>Key Insights:</h3>
                <ul id="keyInsights"></ul>
            </div>
            
            <div class="platform-trends" id="platformTrends"></div>
        </div>
        
        <div class="section">
            <h2>✨ Generated Business Posts</h2>
            <p style="margin-bottom: 20px; color: #666;">Here are 5 example posts based on current trends that you can use to generate business:</p>
            
            <div class="posts-grid" id="generatedPosts"></div>
        </div>
        
        <button class="refresh-button" onclick="refreshData()">🔄 Refresh Trends & Generate New Posts</button>
    </div>

    <script>
        // Simulated social media trending data for nutrition and meal preparation
        const trendingData = {
            twitter: [
                { topic: "High-Protein Breakfast Ideas", engagement: "125K tweets", trend: "↑ 45%" },
                { topic: "Meal Prep Sunday", engagement: "89K tweets", trend: "↑ 32%" },
                { topic: "Mediterranean Diet Benefits", engagement: "76K tweets", trend: "↑ 28%" },
                { topic: "Budget-Friendly Meals", engagement: "92K tweets", trend: "↑ 38%" }
            ],
            instagram: [
                { topic: "Smoothie Bowl Recipes", engagement: "2.3M posts", trend: "↑ 52%" },
                { topic: "Meal Prep Containers", engagement: "1.8M posts", trend: "↑ 41%" },
                { topic: "Healthy Snack Ideas", engagement: "3.1M posts", trend: "↑ 48%" },
                { topic: "Plant-Based Meals", engagement: "2.7M posts", trend: "↑ 55%" }
            ],
            facebook: [
                { topic: "Easy Dinner Recipes", engagement: "450K shares", trend: "↑ 36%" },
                { topic: "Nutrition Tips for Families", engagement: "380K shares", trend: "↑ 29%" },
                { topic: "Batch Cooking Strategies", engagement: "290K shares", trend: "↑ 44%" },
                { topic: "Healthy Eating on a Budget", engagement: "520K shares", trend: "↑ 51%" }
            ],
            tiktok: [
                { topic: "5-Minute Meal Prep", engagement: "45M views", trend: "↑ 68%" },
                { topic: "Protein-Packed Snacks", engagement: "38M views", trend: "↑ 59%" },
                { topic: "Meal Prep for Weight Loss", engagement: "52M views", trend: "↑ 72%" },
                { topic: "Budget Grocery Hauls", engagement: "41M views", trend: "↑ 64%" }
            ]
        };

        const platformIcons = {
            twitter: "🐦",
            instagram: "📷",
            facebook: "👥",
            tiktok: "🎵"
        };

        const platformNames = {
            twitter: "Twitter",
            instagram: "Instagram",
            facebook: "Facebook",
            tiktok: "TikTok"
        };

        // Key insights based on trends
        const keyInsights = [
            "High-protein content is trending across all platforms (+50% average engagement)",
            "Quick meal prep (5-10 minutes) is extremely popular on TikTok and Instagram",
            "Budget-conscious nutrition content sees high engagement on Facebook and Twitter",
            "Plant-based and Mediterranean diet topics are growing rapidly",
            "Visual meal prep content (containers, before/after) performs best on Instagram"
        ];

        // Post templates that will be dynamically generated
        const postTemplates = [
            {
                platform: "Instagram",
                template: (trend) => `🌟 Transform your mornings with our ${trend}! 💪\n\nReady to meal prep like a pro? Our easy-to-follow guide shows you how to create delicious, healthy meals that save time AND money.\n\n✅ Quick prep (under 30 min)\n✅ Budget-friendly ingredients\n✅ Nutrition-packed meals\n✅ Stays fresh all week\n\nDM us "MEAL PREP" for your free starter guide! 📥`,
                hashtags: "#MealPrep #HealthyEating #NutritionTips #MealPrepSunday #HealthyLifestyle #CleanEating #FitnessFood #MealPrepIdeas"
            },
            {
                platform: "Facebook",
                template: (trend) => `🍳 Looking for ${trend}?\n\nWe've got you covered! Our nutrition experts have put together an AMAZING collection of meal prep recipes that are:\n\n🥗 Delicious and satisfying\n⏱️ Quick to prepare\n💰 Budget-friendly\n🥑 Packed with nutrients\n\nPerfect for busy professionals, parents, and anyone who wants to eat healthy without spending hours in the kitchen!\n\nClick the link in our bio to get started today! 👆`,
                hashtags: "#HealthyEating #MealPrepMadeEasy #NutritionCoach #HealthyRecipes #FamilyMeals"
            },
            {
                platform: "Twitter",
                template: (trend) => `🔥 ${trend} are taking over social media!\n\nWant to know the secret? It's all about:\n\n✅ Planning ahead\n✅ Using the right ingredients\n✅ Simple, repeatable recipes\n\nGet our FREE meal prep checklist and join thousands who've transformed their eating habits 👇`,
                hashtags: "#MealPrep #HealthyLiving #NutritionTips #HealthyEating #MealPrepMonday"
            },
            {
                platform: "TikTok/Reels",
                template: (trend) => `⚡ ${trend} in 5 minutes or less!\n\nNo more excuses! Here's what you need:\n\n1️⃣ Fresh ingredients\n2️⃣ Quality containers\n3️⃣ Our simple method\n\nThat's it! Meal prep doesn't have to be complicated.\n\n💬 Comment "RECIPE" below and we'll send you our top 10 quick meal prep recipes FREE!\n\n✨ Save this for later!`,
                hashtags: "#MealPrepTok #QuickMeals #HealthyRecipes #MealPrepIdeas #HealthTok #FoodTok #MealPrepping"
            },
            {
                platform: "Multi-Platform",
                template: (trend) => `🎯 SPECIAL OFFER: ${trend} Meal Plan Bundle! 🎯\n\nFor a limited time, get our complete meal prep system including:\n\n📚 50+ tested recipes\n🛒 Shopping lists for each week\n📊 Nutrition breakdowns\n⏰ Time-saving prep guides\n📱 Mobile-friendly format\n\nNormally $47, now just $27! Use code: MEALPREP30 at checkout.\n\n🔗 Link in bio - Offer ends soon!\n\n✨ Start your journey to healthier, easier meals today!`,
                hashtags: "#MealPrepDeals #HealthyEatingMadeEasy #NutritionPlan #MealPrepService #HealthyLiving #MealPrepBusiness"
            }
        ];

        function displayPlatformTrends() {
            const container = document.getElementById('platformTrends');
            container.innerHTML = '';

            for (const [platform, trends] of Object.entries(trendingData)) {
                const card = document.createElement('div');
                card.className = 'platform-card';
                
                let trendsHTML = trends.map(t => `
                    <div class="trend-item">
                        <strong>${t.topic}</strong>
                        <div class="engagement">
                            ${t.engagement} • ${t.trend}
                        </div>
                    </div>
                `).join('');

                card.innerHTML = `
                    <div class="platform-header">
                        <span class="platform-icon">${platformIcons[platform]}</span>
                        ${platformNames[platform]}
                    </div>
                    ${trendsHTML}
                `;
                
                container.appendChild(card);
            }
        }

        function generatePosts() {
            const container = document.getElementById('generatedPosts');
            container.innerHTML = '';

            // Get some random trending topics
            const allTopics = [
                ...trendingData.twitter.map(t => t.topic),
                ...trendingData.instagram.map(t => t.topic),
                ...trendingData.facebook.map(t => t.topic),
                ...trendingData.tiktok.map(t => t.topic)
            ];

            // Generate 5 posts
            postTemplates.forEach((template, index) => {
                const randomTopic = allTopics[Math.floor(Math.random() * allTopics.length)];
                const postContent = template.template(randomTopic);
                
                const postCard = document.createElement('div');
                postCard.className = 'post-card';
                
                postCard.innerHTML = `
                    <div class="post-number">${index + 1}</div>
                    <div class="post-platform">📱 ${template.platform}</div>
                    <div class="post-content">${postContent}</div>
                    <div class="post-hashtags">${template.hashtags}</div>
                    <button class="copy-button" onclick="copyPost(this)">📋 Copy Post</button>
                `;
                
                container.appendChild(postCard);
            });
        }

        function displayKeyInsights() {
            const container = document.getElementById('keyInsights');
            container.innerHTML = keyInsights.map(insight => `<li>${insight}</li>`).join('');
        }

        function copyPost(button) {
            const postCard = button.parentElement;
            const platform = postCard.querySelector('.post-platform').textContent;
            const content = postCard.querySelector('.post-content').textContent;
            const hashtags = postCard.querySelector('.post-hashtags').textContent;
            
            const fullPost = `${platform}\n\n${content}\n\n${hashtags}`;
            
            navigator.clipboard.writeText(fullPost).then(() => {
                button.textContent = '✅ Copied!';
                button.classList.add('copied');
                
                setTimeout(() => {
                    button.textContent = '📋 Copy Post';
                    button.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy:', err);
                alert('Failed to copy. Please try selecting and copying manually.');
            });
        }

        function refreshData() {
            // Add a slight variation to engagement numbers to simulate new data
            for (const platform in trendingData) {
                trendingData[platform].forEach(item => {
                    const match = item.engagement.match(/[\d.]+/);
                    if (match) {
                        const currentValue = parseFloat(match[0]);
                        const variation = Math.floor(Math.random() * 10) - 5;
                        const newValue = Math.max(1, currentValue + variation);
                        item.engagement = item.engagement.replace(/[\d.]+/, newValue);
                    }
                });
            }
            
            // Refresh displays
            displayPlatformTrends();
            generatePosts();
            
            // Show feedback
            const button = document.querySelector('.refresh-button');
            const originalText = button.textContent;
            button.textContent = '✅ Refreshed!';
            setTimeout(() => {
                button.textContent = originalText;
            }, 2000);
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            displayKeyInsights();
            displayPlatformTrends();
            generatePosts();
        });
    </script>
</body>
</html>
